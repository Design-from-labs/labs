    ref: be6bd884c85d52cca930b09b425ef68858d1b63c
    author: "Alfredo Natal II (anl331) <https://github.com/anl331>"
    license: MIT
    attribution: "goey-toast, Copyright (c) 2026 Alfredo Natal II (anl331). MIT License."
    credit: S-101
    components:
      - name: gooey-toast
        upstream: src
