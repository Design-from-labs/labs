# Approved component sources. Contract: docs/contract.md. Read by the scanner
# (.github/workflows/scanner.yml, scripts/scan-sources.mjs) and the license
# check (scripts/check-licenses.mjs). A component under
# content/components/<id>/ must belong to an `active` source listed here.
#
# Fields (first-party `sources` and third-party `oss` alike):
#   id          lower-kebab id; also the directory under content/components/
#   name        a human name
#   repo        owner/name on GitHub
#   visibility  public | private
#   path        where its components land in this repository
#   status      active | paused (paused: nothing new is accepted)
#   fetch       how components arrive:
#                 exports-only  the source pushes export pull requests here
#                               (private sources; never fetched from here)
#                 in-repo       authored in this repository
#                 pinned-git    the scanner fetches `ref` from a public repo
#   license     the SPDX license its components are published under
version: 1

sources:
  - id: design-from-app
    name: Design From app
    repo: AndrewUlloa/Design-From
    visibility: private
    path: content/components/design-from-app
    status: active
    fetch: exports-only
    license: MIT

  - id: labs-examples
    name: Labs examples
    repo: Design-from-labs/labs
    visibility: public
    path: content/components/labs-examples
    status: active
    fetch: in-repo
    license: MIT

# Third-party open-source components. Empty until the owner approves one.
# Entry format (every field required unless marked optional):
#
#   - id: example-oss                # lower-kebab; directory under content/components/
#     name: Example components
#     repo: https://github.com/example/components   # public https URL
#     visibility: public
#     status: active                 # active | paused
#     fetch: pinned-git
#     ref: 0123456789abcdef0123456789abcdef01234567  # full commit SHA, never a branch
#     author: "Jane Example <https://example.com>"
#     license: MIT                   # SPDX id on the allowlist (docs/contract.md, section 6)
#     attribution: "Copyright (c) 2025 Jane Example. MIT License."
#     credit: S-0NN                  # its entry in docs/sources/registry.yaml
#     components:
#       - name: spinner              # the component slug published here
#         status: beta               # status written to meta.json; the owner promotes to ready
#         category: feedback
#         items:                     # registry-item JSON files at `ref`, one per variant
#           - variant: spinner-radix-lucide
#             primitive: radix         # radix | base | aria | none
#             iconSet: lucide          # lucide | phosphor | none
#             path: public/r/spinner-radix-lucide.json
#           - variant: spinner-radix-phosphor
#             primitive: radix
#             iconSet: phosphor
#             path: public/r/spinner-radix-phosphor.json
#         demo: demos/spinner.tsx    # optional; else the scanner writes a stub demo
#         credits: [S-0NN]           # optional extra credits
#
# The scanner (.github/workflows/scanner.yml) fetches the pinned files and
# opens a pull request; it never follows a branch. Bump `ref` to update.
oss:
  # Ported by hand in this repository from the pinned commit (fetch: in-repo;
  # the scanner only fetches pinned-git sources). The upstream ships HTML
  # demos, not registry items. Port notes and fidelity evidence:
  # docs/evidence/ports/<component>/fidelity.md.
  - id: yui540-css-animations
    name: yui540 CSS animations
    repo: https://github.com/yui540/css-animations
    visibility: public
    status: active
    fetch: in-repo
    ref: e30edfcfcc3e0f7a3bd44f3d5566ee23c9aaa186
    author: "yui540 <https://github.com/yui540>"
    license: MIT
    attribution: "Copyright (c) 2026 yui540. MIT License."
    credit: S-150
    components:
      - name: blocks
        status: beta
        category: feedback
        upstream: 2026-04-18/tips-1.html
      - name: domino
        status: beta
        category: feedback
        upstream: 2026-04-18/tips-2.html
      - name: clatter-shake
        status: beta
        category: feedback
        upstream: 2026-04-18/tips-3.html
      - name: pop-out
        status: beta
        category: feedback
        upstream: 2026-04-18/tips-4.html
      - name: scroll-unroll
        status: beta
        category: feedback
        upstream: 2026-04-25/tips-1.html
      - name: rattle-bounce
        status: beta
        category: feedback
        upstream: 2026-04-25/tips-2.html
      - name: swap
        status: beta
        category: feedback
        upstream: 2026-04-25/tips-3.html
      - name: ripple
        status: beta
        category: feedback
        upstream: 2026-04-25/tips-4.html

  # Ported by hand from the pinned commit, with the port's sources in
  # ports/<id>/<component>/ and exported to content/components/ by
  # `pnpm ports` (scripts/export-ports.mjs; CI runs `pnpm ports:check`).
  # Fidelity evidence: docs/evidence/ports/<component>/fidelity.md.
  - id: torph
    name: torph by Lochie Axon
    repo: https://github.com/lochie/torph
    visibility: public
    status: active
    fetch: in-repo
    ref: d79a5aa63226acf97d49c3e34fafb2e85c07b026
    author: "Lochie Axon <https://lochieaxon.com>"
    license: MIT
    attribution: "torph, Copyright (c) 2025 Lochie Axon. MIT License."
    credit: S-100
    components:
      - name: text-morph
        upstream: packages/torph/src
        status: beta
        category: typography

  - id: goey-toast
    name: goey-toast by anl331
