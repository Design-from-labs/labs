name: Publish to npm

# Publishes @designfrom/react and designfrom (the CLI) to npm with provenance.
# Authenticates with npm trusted publishing (OIDC) only: no NPM_TOKEN secret.
# Runs only by hand, only from main (docs/publishing.md).
on:
  workflow_dispatch:
    inputs:
      package:
        description: Which package to publish
        type: choice
        options: [both, "@designfrom/react", designfrom]
        default: both
      dry-run:
        description: Pack and check without publishing
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    name: publish
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install, verify and build
        run: |
          pnpm install --frozen-lockfile
          pnpm validate:content
          pnpm check:licenses
          pnpm build
          pnpm pack:dry

      - name: Publish (npm trusted publishing, no stored token)
        shell: bash
        env:
          WHICH: ${{ inputs.package }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -euo pipefail
          # Trusted publishing (OIDC) needs npm >= 11.5. Auth comes from this
          # workflow's GitHub OIDC token, matched against the trusted-publisher
          # config on npmjs.com (Design-from-labs/labs, publish.yml). No NPM_TOKEN.
          npm install -g npm@11 --no-fund --no-audit >/dev/null
          npm --version
          out="$RUNNER_TEMP/tarballs"; mkdir -p "$out"
          flags=(--access public --provenance)
          [[ "$DRY_RUN" == "true" ]] && flags+=(--dry-run)
          if [[ "$WHICH" == "both" || "$WHICH" == "@designfrom/react" ]]; then
            (cd packages/react && pnpm pack --pack-destination "$out")
          fi
          if [[ "$WHICH" == "both" || "$WHICH" == "designfrom" ]]; then
            (cd packages/cli && pnpm pack --pack-destination "$out")
          fi
          for t in "$out"/*.tgz; do npm publish "$t" "${flags[@]}"; done
