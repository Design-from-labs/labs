name: Scanner

# Reads sources.yaml (docs/scanner.md):
# - third-party (oss) sources: fetches each listed registry item at its
#   pinned commit and proposes new or changed components on the
#   scanner/oss branch, as a pull request into staging;
# - private sources: never fetched. Their export pull requests arrive from
#   the source repository, which then sends a `component-export`
#   repository_dispatch; this workflow checks that pull request's scope.
#
# GitHub-hosted runners: this repository is public (decision 0006).
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [component-export]

concurrency:
  group: scanner
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  oss:
    name: scan third-party sources
    if: ${{ github.event_name != 'repository_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout staging
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: staging
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Fetch pinned third-party items
        id: scan
        shell: bash
        run: |
          set -euo pipefail
          node scripts/scan-sources.mjs oss | tee "$RUNNER_TEMP/scan.txt"
          if git status --porcelain -- content/components | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new or changed third-party components." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Validate before proposing
        if: steps.scan.outputs.changed == 'true'
        run: pnpm validate:content && pnpm check:licenses

      # The organization does not let GITHUB_TOKEN open pull requests. With
      # the optional LABS_SCANNER_TOKEN secret (a fine-grained token with
      # contents and pull-requests write on this repository) the scanner
      # opens or updates the pull request itself; without it, it pushes the
      # branch and links a ready-made compare page in the run summary.
      - name: Open or update the pull request
        if: steps.scan.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.LABS_SCANNER_TOKEN || github.token }}
          HAS_PR_TOKEN: ${{ secrets.LABS_SCANNER_TOKEN != '' }}
        shell: bash
        run: |
          set -euo pipefail
          branch=scanner/oss
          git config user.name "labs-scanner"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$branch"
          git add content/components
          git commit -m "chore(content): update third-party components from pinned sources" -m "Generated by the scanner from sources.yaml."
          git push --force origin "$branch"
          body="$(printf '%s\n\n## Sources\n\n%s\n' \
            "Generated by the scanner from sources.yaml. New and changed third-party components arrive as beta: review the code, add a demo and a preview, then mark them ready." \
            "The credits in each component's meta.json and its entry in sources.yaml.")"
          if [[ "$HAS_PR_TOKEN" == "true" ]]; then
            if gh pr view "$branch" -R "$GITHUB_REPOSITORY" --json state --jq .state 2>/dev/null | grep -q OPEN; then
              echo "Updated the open pull request for $branch." >> "$GITHUB_STEP_SUMMARY"
            else
              gh pr create -R "$GITHUB_REPOSITORY" --base staging --head "$branch" \
                --title "chore(content): third-party component updates" --body "$body"
            fi
          else
            echo "Pushed $branch. Open the pull request: https://github.com/$GITHUB_REPOSITORY/compare/staging...$branch?expand=1" >> "$GITHUB_STEP_SUMMARY"
          fi

  export:
    name: check a component export
    if: ${{ github.event_name == 'repository_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: staging
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check the export pull request's scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.client_payload.pr }}
        shell: bash
        run: |
          set -uo pipefail
          node scripts/scan-sources.mjs dispatch "$GITHUB_EVENT_PATH" > "$RUNNER_TEMP/report.md"
          status=$?
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$PR" =~ ^[0-9]+$ ]]; then
            gh pr comment "$PR" -R "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/report.md" || true
          fi
          exit $status
